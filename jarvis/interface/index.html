<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Interface</title>
    <style>
        body {
            background-color: #000;
            color: #00d2ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #hud-container {
            border: 2px solid #00d2ff;
            border-radius: 50%;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            from { box-shadow: 0 0 10px #00d2ff; }
            to { box-shadow: 0 0 30px #00d2ff; }
        }
        #chat-window {
            width: 60%;
            height: 40%;
            border: 1px solid #00d2ff;
            margin-top: 20px;
            padding: 10px;
            overflow-y: auto;
            background: rgba(0, 210, 255, 0.1);
        }
        #sidebar {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 200px;
            border-left: 1px solid #00d2ff;
            padding-left: 20px;
            text-align: left;
        }
        input {
            width: 80%;
            background: transparent;
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="hud-container">
        <h1>JARVIS</h1>
    </div>
    <div id="sidebar">
        <h3>SYSTEM STATUS</h3>
        <div id="cpu">CPU: --%</div>
        <div id="mem">MEM: --%</div>
        <hr>
        <h3>LOGS</h3>
        <div id="log-entries" style="font-size: 0.8em; opacity: 0.7;"></div>
    </div>
    <div id="chat-window">
        <div>System Online. Absolute loyalty confirmed.</div>
    </div>
    <input type="text" id="user-input" placeholder="Give a command..." onkeydown="if(event.key==='Enter') sendCommand()">

    <script>
        // System status simulation
        setInterval(() => {
            document.getElementById('cpu').innerText = "CPU: " + (Math.random() * 20 + 5).toFixed(1) + "%";
            document.getElementById('mem').innerText = "MEM: " + (Math.random() * 10 + 40).toFixed(1) + "%";
        }, 3000);

        async function sendCommand() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-window');
            const command = input.value;

            if (command) {
                const userMsg = document.createElement('div');
                userMsg.innerText = "User: " + command;
                chat.appendChild(userMsg);

                input.value = '';

                try {
                    const response = await fetch('/command', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ command: command })
                    });
                    const data = await response.json();

                    const jarvisMsg = document.createElement('div');
                    jarvisMsg.innerText = "JARVIS: " + (data.response || data.error);
                    chat.appendChild(jarvisMsg);

                    // Add to log
                    const logEntries = document.getElementById('log-entries');
                    const entry = document.createElement('div');
                    entry.innerText = "> " + command;
                    logEntries.appendChild(entry);
                } catch (error) {
                    const errorMsg = document.createElement('div');
                    errorMsg.innerText = "System Error: Could not connect to core.";
                    chat.appendChild(errorMsg);
                }

                chat.scrollTop = chat.scrollHeight;
            }
        }
    </script>
</body>
</html>
