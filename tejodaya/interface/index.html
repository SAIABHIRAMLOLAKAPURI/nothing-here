<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tejodaya Interface</title>
    <style>
        body {
            background-color: #000;
            color: #ffaa00; /* Golden theme for Tejodaya */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle, #331a00 0%, #000 100%);
        }
        #hud-container {
            border: 4px double #ffaa00;
            border-radius: 50%;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px #ffaa00, inset 0 0 20px #ffaa00;
            margin-bottom: 10px;
            transition: all 0.5s ease;
        }
        #hud-container::before {
            content: '';
            position: absolute;
            width: 110%;
            height: 110%;
            border: 1px dashed #ffaa00;
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }
        #arc-reactor {
            width: 120px;
            height: 120px;
            border: 5px solid #ffaa00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px #ffaa00, inset 0 0 30px #ffaa00;
            animation: pulse 2s infinite alternate;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            from { opacity: 0.6; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }
        #chat-window {
            width: 80%;
            height: 30%;
            border: 1px solid rgba(255, 170, 0, 0.3);
            margin-top: 10px;
            padding: 15px;
            overflow-y: auto;
            background: rgba(50, 30, 0, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.2);
            scrollbar-width: thin;
            scrollbar-color: #ffaa00 transparent;
        }
        #chat-window::-webkit-scrollbar {
            width: 5px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background-color: #ffaa00;
        }
        #sidebar {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 250px;
            background: rgba(255, 170, 0, 0.05);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid rgba(255, 170, 0, 0.2);
        }
        #left-sidebar {
            position: absolute;
            left: 20px;
            top: 20px;
            width: 250px;
            background: rgba(255, 170, 0, 0.05);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid rgba(255, 170, 0, 0.2);
        }
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            background: rgba(255, 170, 0, 0.1);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 5px 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #ffaa00;
            color: #000;
        }
        input {
            width: 80%;
            background: rgba(255, 170, 0, 0.1);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 12px;
            margin-top: 10px;
            border-radius: 5px;
            outline: none;
        }
        .user-msg { color: #fff; margin-bottom: 5px; }
        .tejodaya-msg { color: #ffaa00; font-weight: bold; margin-bottom: 10px; border-left: 2px solid #ffaa00; padding-left: 10px; }
        .dashboard-item { margin-bottom: 10px; font-size: 0.9em; }
        .progress-bar { width: 100%; height: 5px; background: #222; border-radius: 5px; margin-top: 5px; }
        .progress-fill { height: 100%; background: #ffaa00; border-radius: 5px; width: 0%; transition: width 1s; }
    </style>
</head>
<body>
    <div id="left-sidebar">
        <h3 style="margin-top:0;">LIFE MANAGEMENT</h3>
        <div class="dashboard-item">Tasks: <span id="task-count">0</span></div>
        <div class="dashboard-item">Goals: <span id="goal-count">0</span></div>
        <div class="dashboard-item">Discipline Score: <span id="discipline-score">0</span>%
            <div class="progress-bar"><div id="discipline-progress" class="progress-fill"></div></div>
        </div>
        <div class="dashboard-item">XP Level: <span id="xp-level">1</span>
            <div class="progress-bar"><div id="xp-progress" class="progress-fill"></div></div>
        </div>
    </div>

    <div id="hud-container">
        <div id="arc-reactor">
            <h2 style="text-shadow: 0 0 10px #ffaa00;">TEJODAYA</h2>
        </div>
    </div>

    <div id="sidebar">
        <h3 style="margin-top:0;">HEALTH STATUS</h3>
        <div class="dashboard-item">Hydration: <span id="water-log">0</span> glasses</div>
        <div class="dashboard-item">Calories: <span id="calories">0</span> / 2500</div>
        <div class="dashboard-item">Workout: <span id="workout-status">Not Started</span></div>
        <hr style="border-color: rgba(255, 170, 0, 0.2);">
        <h3>SYSTEM STATUS</h3>
        <div id="cpu">CPU: --%</div>
        <div id="mem">MEM: --%</div>
    </div>

    <div id="chat-window">
        <div class="tejodaya-msg">Tejodaya Online. Life Management System Initialized. Awaiting your guidance, Sir.</div>
    </div>

    <input type="text" id="user-input" placeholder="Awaiting your command, Sir..." onkeydown="if(event.key==='Enter') sendCommand()">

    <div class="controls">
        <button id="voice-toggle">Voice: ON</button>
        <button id="mic-btn">Listen</button>
    </div>

    <script>
        const API_TOKEN = "tejodaya_secure_token_2026";
        let voiceEnabled = true;

        // Voice Synth
        const synth = window.speechSynthesis;
        function speak(text) {
            if (!voiceEnabled) return;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            const voices = synth.getVoices();
            utter.voice = voices.find(v => v.name.includes('Google UK English Male') || v.name.includes('Male') || v.lang === 'en-GB') || voices[0];
            utter.pitch = 0.9;
            utter.rate = 1.0;
            synth.speak(utter);
        }

        // Voice Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                sendCommand();
            };

            document.getElementById('mic-btn').onclick = () => {
                recognition.start();
                document.getElementById('mic-btn').innerText = "Listening...";
            };

            recognition.onend = () => {
                document.getElementById('mic-btn').innerText = "Listen";
            };
        } else {
            document.getElementById('mic-btn').style.display = 'none';
        }

        document.getElementById('voice-toggle').onclick = () => {
            voiceEnabled = !voiceEnabled;
            document.getElementById('voice-toggle').innerText = "Voice: " + (voiceEnabled ? "ON" : "OFF");
            if (!voiceEnabled) synth.cancel();
        };

        // System status simulation
        setInterval(() => {
            document.getElementById('cpu').innerText = "CPU: " + (Math.random() * 15 + 2).toFixed(1) + "%";
            document.getElementById('mem').innerText = "MEM: " + (Math.random() * 5 + 38).toFixed(1) + "%";
        }, 3000);

        async function sendCommand() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-window');
            const command = input.value;

            if (command) {
                const userMsg = document.createElement('div');
                userMsg.className = 'user-msg';
                userMsg.innerText = "Sir: " + command;
                chat.appendChild(userMsg);

                input.value = '';

                try {
                    const response = await fetch('/command', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + API_TOKEN
                        },
                        body: JSON.stringify({ command: command })
                    });
                    const data = await response.json();

                    const tejodayaMsg = document.createElement('div');
                    tejodayaMsg.className = 'tejodaya-msg';
                    const reply = data.response || data.error;
                    tejodayaMsg.innerText = "TEJODAYA: " + reply;
                    chat.appendChild(tejodayaMsg);

                    speak(reply);
                    updateDashboard(command, reply);

                } catch (error) {
                    const errorMsg = document.createElement('div');
                    errorMsg.innerText = "System Error: Core connection lost.";
                    chat.appendChild(errorMsg);
                }

                chat.scrollTop = chat.scrollHeight;
            }
        }

        function updateDashboard(cmd, reply) {
            const c = cmd.toLowerCase();
            if (c.includes("add task")) {
                document.getElementById('task-count').innerText = parseInt(document.getElementById('task-count').innerText) + 1;
            } else if (c.includes("add goal")) {
                document.getElementById('goal-count').innerText = parseInt(document.getElementById('goal-count').innerText) + 1;
            } else if (c.includes("water")) {
                document.getElementById('water-log').innerText = parseInt(document.getElementById('water-log').innerText) + 1;
            } else if (c.includes("habit") || c.includes("completed")) {
                let score = Math.min(100, parseInt(document.getElementById('discipline-score').innerText) + 5);
                document.getElementById('discipline-score').innerText = score;
                document.getElementById('discipline-progress').style.width = score + "%";

                let xp = parseInt(document.getElementById('xp-progress').style.width || 0) + 10;
                if (xp >= 100) {
                    xp = 0;
                    document.getElementById('xp-level').innerText = parseInt(document.getElementById('xp-level').innerText) + 1;
                }
                document.getElementById('xp-progress').style.width = xp + "%";
            } else if (c.includes("workout")) {
                document.getElementById('workout-status').innerText = "Logged";
            }
        }

        // Initial Greeting
        window.onload = () => {
            setTimeout(() => speak("Tejodaya online. At your service, Sir. Life management system is operational."), 1000);
        };
    </script>
</body>
</html>
